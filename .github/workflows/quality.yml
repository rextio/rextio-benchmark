name: quality

on:
  push:
    branches: [main, "0.1.1"]
  pull_request:
    branches: [main, "0.1.1"]

permissions:
  contents: read

jobs:
  deterministic-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so verify_report can resolve run-input blobs at the
          # frozen measurement commit (not only the shallow tip).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - name: Sync lightweight base profile
        run: uv sync --project profiles/base --locked --python 3.11
      - name: Verify all lock files
        run: |
          uv lock --project profiles/base --check
          uv lock --project profiles/torch-cpu --check
          uv lock --project profiles/tensorflow-cpu --check
          uv lock --project profiles/torch-cuda --check
          uv lock --project profiles/tensorflow-cuda --check
      - name: Ruff
        env:
          PYTHONPATH: src
        run: profiles/base/.venv/bin/ruff check src tests cases
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: profiles/base/.venv/bin/python -m pytest
      - name: Verify frozen released canonical report
        env:
          PYTHONPATH: src
        run: >
          profiles/base/.venv/bin/python -m rextio_benchmark verify
          results/canonical/cohort-15fa2645c757b4a23541587f7d0757107952f7c6ade3386bcaacdbdd9cce12d8/report.json

